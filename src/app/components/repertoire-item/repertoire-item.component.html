<article class="piece">
    <span class="piece-number">{{ number() }}</span>
    <span class="piece-year">{{ item().year }}</span>
    <div class="piece-body">
        <h3 class="piece-title">{{ item().title }}</h3>
        <p class="piece-label">{{ item().label }}</p>
        <p class="piece-text">{{ item().description }}</p>
    </div>
</article>
